<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title">
  <title id="title">Open Agent Protocol at a glance: clients drive an agent over agent-control-core; the built-in loop or a harness adapter runs it; model IO crosses model-provider-core to a catalogued model provider.</title>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#5a6b8c"/>
    </marker>
  </defs>
  <style>
    text { font-family: ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #33383f; }
    .boxtitle { font-size: 14px; font-weight: 700; }
    .chip { font-size: 13px; font-weight: 600; }
    .body { font-size: 12px; fill: #4d5766; }
    .small { font-size: 11px; fill: #6a7482; }
    .lbl { font-size: 12px; fill: #4d5766; }
    .c-blue { fill: #33517e; }
    .c-amber { fill: #6b4a12; }
    .c-purple { fill: #4c3577; }
    .c-green { fill: #2c6b45; }
  </style>

  <rect width="900" height="500" fill="#ffffff"/>

  <!-- Clients -->
  <rect x="40" y="20" width="820" height="80" rx="10" fill="#eff4fc" stroke="#9db4dd" stroke-dasharray="6 4"/>
  <text x="56" y="41" class="small c-blue" font-weight="700">CLIENTS</text>
  <rect x="56" y="50" width="212" height="38" rx="8" fill="#ffffff" stroke="#9db4dd"/>
  <text x="162" y="74" class="chip" text-anchor="middle">Terminal UI (oapx)</text>
  <rect x="280" y="50" width="318" height="38" rx="8" fill="#ffffff" stroke="#9db4dd"/>
  <text x="439" y="74" class="chip" text-anchor="middle">SDKs: Go · Python · Rust · TypeScript</text>
  <rect x="610" y="50" width="230" height="38" rx="8" fill="#ffffff" stroke="#9db4dd"/>
  <text x="725" y="74" class="chip" text-anchor="middle">Any OAP client</text>

  <!-- Arrow: clients -> agent-control-core -->
  <line x1="450" y1="100" x2="450" y2="150" stroke="#5a6b8c" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="466" y="118" class="lbl">sessions · runs · streamed content</text>
  <text x="466" y="134" class="lbl">tool calls · permission prompts · cancellation</text>

  <!-- agent-control-core -->
  <rect x="110" y="152" width="680" height="168" rx="10" fill="#fdf3e3" stroke="#c8963b"/>
  <text x="450" y="178" class="boxtitle c-amber" text-anchor="middle">agent-control-core</text>
  <rect x="140" y="196" width="300" height="100" rx="8" fill="#ffffff" stroke="#c8963b"/>
  <text x="290" y="222" class="chip" text-anchor="middle">Built-in agent loop</text>
  <text x="290" y="244" class="body" text-anchor="middle">workspace tools · permission gates</text>
  <text x="290" y="262" class="body" text-anchor="middle">queueing · compaction between turns</text>
  <text x="290" y="284" class="small" text-anchor="middle">inference via model-provider-core</text>
  <rect x="460" y="196" width="300" height="100" rx="8" fill="#ffffff" stroke="#c8963b"/>
  <text x="610" y="222" class="chip" text-anchor="middle">Harness adapters</text>
  <text x="610" y="244" class="body" text-anchor="middle">Claude Code · Codex · Pi</text>
  <text x="610" y="262" class="body" text-anchor="middle">ACP · Hermes · DeepSeek · OpenCode</text>
  <text x="610" y="284" class="small" text-anchor="middle">each pinned to tested versions</text>

  <!-- Arrow: agent loop -> model-provider-core -->
  <line x1="450" y1="320" x2="450" y2="372" stroke="#5a6b8c" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="466" y="345" class="lbl">inference.create → inference.part.* → inference.completed</text>

  <!-- model-provider-core -->
  <rect x="110" y="374" width="380" height="96" rx="10" fill="#f4effb" stroke="#8a6fc9"/>
  <text x="300" y="400" class="boxtitle c-purple" text-anchor="middle">model-provider-core</text>
  <text x="300" y="422" class="body" text-anchor="middle">one inference request,</text>
  <text x="300" y="440" class="body" text-anchor="middle">its parts as they stream</text>

  <!-- Arrow: provider profile -> providers -->
  <line x1="490" y1="422" x2="570" y2="422" stroke="#5a6b8c" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="530" y="410" class="small" text-anchor="middle">HTTP binding</text>

  <!-- Model providers -->
  <rect x="560" y="374" width="300" height="96" rx="10" fill="#ecf6ef" stroke="#4f9e6b"/>
  <text x="710" y="400" class="boxtitle c-green" text-anchor="middle">Model providers</text>
  <text x="710" y="422" class="body" text-anchor="middle">24 catalogued</text>
  <text x="710" y="440" class="body" text-anchor="middle">Anthropic · OpenAI · Google · Kimi · …</text>

  <text x="450" y="490" class="small" text-anchor="middle">Both profiles can be served apart, or together on one stdio connection (oapx serve agent,provider)</text>
</svg>
