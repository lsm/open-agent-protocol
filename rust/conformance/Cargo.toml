[package]
name = "oap-conformance"
version = "0.1.0"
edition = "2021"
description = "Open Agent Protocol endpoint conformance runner"
repository = "https://github.com/lsm/open-agent-protocol"
license = "CC0-1.0"
publish = false

[dependencies]
oap-adapter = { path = "../adapter" }
oap-protocol = { path = "../protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[lints.rust]
unsafe_code = "forbid"
