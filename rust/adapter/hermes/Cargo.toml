[package]
name = "oxap-adapter-hermes"
version = "0.1.0"
edition = "2021"
description = "The Open Agent Protocol adapter over the Hermes TUI gateway on stdio"
repository = "https://github.com/lsm/oxap"
license = "CC0-1.0"
publish = false

[dependencies]
crossbeam-channel = "0.5"
oxap-adapter = { path = "..", version = "=0.1.0" }
rustix = { version = "1", features = ["event"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

[lints.rust]
unsafe_code = "forbid"
