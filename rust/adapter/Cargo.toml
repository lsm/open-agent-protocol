[package]
name = "oap-adapter"
version = "0.1.0"
edition = "2021"
description = "The Open Agent Protocol adapter contract every harness adapter implements"
repository = "https://github.com/lsm/open-agent-protocol"
license = "CC0-1.0"
publish = false

[dependencies]
futures-core = "0.3"
oap-protocol = { path = "../protocol" }
serde = "1"
serde_json = "1"
thiserror = "2"

[dev-dependencies]
futures = "0.3"

[lints.rust]
unsafe_code = "forbid"
