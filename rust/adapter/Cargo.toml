[package]
name = "oxap-adapter"
version = "0.1.0"
edition = "2021"
description = "The Open Agent Protocol adapter contract every harness adapter implements"
repository = "https://github.com/lsm/oxap"
license = "CC0-1.0"
publish = false

[dependencies]
crossbeam-channel = "0.5"
futures = { version = "0.3", optional = true }
futures-core = "0.3"
oxap-protocol = { path = "../protocol", version = "=0.1.0" }
oxap-validation = { path = "../validation", version = "=0.1.0" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "unbounded_depth"] }
thiserror = "2"

[features]
testkit = ["dep:futures"]

[dev-dependencies]
futures = "0.3"

[lints.rust]
unsafe_code = "forbid"
