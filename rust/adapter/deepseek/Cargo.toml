[package]
name = "oap-adapter-deepseek"
version = "0.1.0"
edition = "2021"
description = "The Open Agent Protocol adapter over the DeepSeek harness SDK runtime on stdio"
repository = "https://github.com/lsm/oxap"
license = "CC0-1.0"
publish = false

[dependencies]
crossbeam-channel = "0.5"
futures-channel = "0.3"
oap-adapter = { path = ".." }
oap-harness = { path = "../../harness" }
oap-protocol = { path = "../../protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

[dev-dependencies]
futures = "0.3"
oap-adapter = { path = "..", features = ["testkit"] }

[lints.rust]
unsafe_code = "forbid"
