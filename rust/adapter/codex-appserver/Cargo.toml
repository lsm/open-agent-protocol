[package]
name = "oxap-adapter-codex-appserver"
version = "0.1.0"
edition = "2021"
description = "The Open Agent Protocol adapter over the Codex app-server on stdio"
repository = "https://github.com/lsm/oxap"
license = "CC0-1.0"

[dependencies]
crossbeam-channel = "0.5"
oxap-adapter = { path = "..", version = "=0.1.0" }
oxap-harness = { path = "../../harness", version = "=0.1.0" }
oxap-protocol = { path = "../../protocol", version = "=0.1.0" }
oxap-validation = { path = "../../validation", version = "=0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

[dev-dependencies]
oxap-adapter = { path = "..", version = "=0.1.0", features = ["testkit"] }

[lints.rust]
unsafe_code = "forbid"
