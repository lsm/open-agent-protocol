[package]
name = "oap-protocol"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Open Agent Protocol envelopes, identifiers and payloads"
repository = "https://github.com/lsm/open-agent-protocol"
license = "CC0-1.0"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"

[lints.rust]
unsafe_code = "forbid"
