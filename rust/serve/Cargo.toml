[package]
name = "oap-serve"
version = "0.1.0"
edition = "2021"
description = "The Open Agent Protocol hub: its adapter registry and the sessions it opens"
repository = "https://github.com/lsm/open-agent-protocol"
license = "CC0-1.0"
publish = false

[dependencies]
oap-adapter = { path = "../adapter" }
oap-binding = { path = "../binding" }
oap-protocol = { path = "../protocol" }
oap-validation = { path = "../validation" }
base64 = "0.22"
httparse = "1"
jsonschema = { version = "=0.59.0", default-features = false, features = ["arbitrary-precision"] }
futures-core = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"

[dev-dependencies]
futures = "0.3"
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[[bin]]
name = "oap-rust-hub"
path = "src/bin/oap_rust_hub.rs"
