name: Release Smoke

# Checks what a release ships rather than what the tree builds: the archives on
# the GitHub Release, verified against SHA256SUMS.txt, and the npm package a
# user installs. Every other SDK job builds oapx from source, so a broken asset or
# an unpublished package passed CI for three releases in a row.
#
# A release published with GITHUB_TOKEN raises no event another workflow can
# hear, so release-binaries.yml calls this one directly after it publishes. It
# can also be run by hand against any tag, and it runs on a pull request that
# changes it, against the latest release, where a release missing from npm is a
# warning rather than a failure.

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to check, such as v0.1.0-alpha.10
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to check; empty means the latest release
        required: false
        type: string
  pull_request:
    paths:
      - .github/workflows/release-smoke.yml

permissions:
  contents: read

concurrency:
  # One group per pull request, so a newer push cancels the run the previous one
  # started; a release or a hand run keys on its own run id and shares nothing.
  group: release-smoke-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  resolve:
    name: Resolve the release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="$REQUESTED"
          if [ -z "$tag" ]; then
            tag="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName')"
          fi
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json tagName >/dev/null
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  assets:
    name: Released binary - ${{ matrix.platform }}
    needs: resolve
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux-x64
            archive: tar.gz
            binary: oxap
            legacy_binary: oapx
            alias: oapx
            sdk_tests: Smoke
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
            archive: tar.gz
            binary: oxap
            legacy_binary: oapx
            alias: oapx
            sdk_tests: Smoke
          - runner: macos-latest
            platform: macos-arm64
            archive: tar.gz
            binary: oxap
            legacy_binary: oapx
            alias: oapx
            sdk_tests: TestSmokeHandshakeAndClose|TestSmokeModelsList$
          - runner: windows-latest
            platform: windows-x64
            archive: zip
            binary: oxap.exe
            legacy_binary: oapx.exe
            alias: oapx.exe
            sdk_tests: TestSmokeHandshakeAndClose|TestSmokeModelsList$
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false

      - name: Download and verify the release archive
        id: asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          ASSET_OXAP: oxap-${{ needs.resolve.outputs.version }}-${{ matrix.platform }}.${{ matrix.archive }}
          ASSET_OAPX: oapx-${{ needs.resolve.outputs.version }}-${{ matrix.platform }}.${{ matrix.archive }}
        run: |
          set -euo pipefail
          temp="$RUNNER_TEMP"
          if command -v cygpath >/dev/null; then temp="$(cygpath -u "$temp")"; fi
          dir="$temp/release"
          mkdir -p "$dir"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$dir" --pattern SHA256SUMS.txt
          cd "$dir"
          ASSET="$ASSET_OXAP"
          expected="$(awk -v name="$ASSET" '$2 == name { print $1 }' SHA256SUMS.txt)"
          if [ -z "$expected" ]; then
            ASSET="$ASSET_OAPX"
            expected="$(awk -v name="$ASSET" '$2 == name { print $1 }' SHA256SUMS.txt)"
          fi
          prefix="$(basename "$ASSET" | cut -d- -f1)"
          echo "binary=$prefix" >> "$GITHUB_OUTPUT"
          if [ -z "$expected" ]; then
            case "$ASSET_OXAP" in
              *-macos-*)
                echo "::warning::$ASSET_OXAP is not in this release; release-binaries withholds an unsigned macOS build on a prerelease"
                echo "withheld=true" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac
            echo "::error::neither $ASSET_OXAP nor $ASSET_OAPX is listed in SHA256SUMS.txt"
            exit 1
          fi
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$dir" --pattern "$ASSET"
          if command -v sha256sum >/dev/null; then
            actual="$(sha256sum "$ASSET" | awk '{ print $1 }')"
          else
            actual="$(shasum -a 256 "$ASSET" | awk '{ print $1 }')"
          fi
          if [ "$expected" != "$actual" ]; then
            echo "::error::$ASSET has digest $actual, SHA256SUMS.txt says $expected"
            exit 1
          fi
          mkdir bin
          case "$ASSET" in
            *.zip) pwsh -NoProfile -Command "Expand-Archive -Path '$ASSET' -DestinationPath bin" ;;
            *) tar -xzf "$ASSET" -C bin ;;
          esac
          binary_name="${{ matrix.binary }}"
          if [ "$prefix" = "oapx" ]; then binary_name="${{ matrix.legacy_binary }}"; fi
          binary="$dir/bin/$binary_name"
          test -f "$binary"
          echo "BINARY=$binary" >> "$GITHUB_ENV"
          if [ "$prefix" = "oxap" ]; then
            alias_binary="$dir/bin/${{ matrix.alias }}"
            test -f "$alias_binary"
            echo "ALIAS_BINARY=$alias_binary" >> "$GITHUB_ENV"
          fi
          if command -v cygpath >/dev/null; then binary="$(cygpath -w "$binary")"; fi
          echo "OAP_SDK_BINARY_PATH=$binary" >> "$GITHUB_ENV"

      - name: The binary reports the release's version
        if: steps.asset.outputs.withheld != 'true'
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          reported="$("$BINARY" --version | tr -d '\r')"
          want_oxap="oxap-$VERSION-${{ matrix.platform }}"
          if [ "$reported" != "$VERSION" ] && [ "$reported" != "$want_oxap" ]; then
            echo "::error::the released binary reports '$reported', the release is $VERSION ($want_oxap)"
            exit 1
          fi

      - name: The oapx alias answers the same and warns on stderr
        if: steps.asset.outputs.binary == 'oxap' && steps.asset.outputs.withheld != 'true'
        shell: bash
        run: |
          set -euo pipefail
          for args in "--version" "--help" "serve ghost"; do
            "$BINARY" $args > /tmp/oxap.out 2>/tmp/oxap.err && oxap_rc=0 || oxap_rc=$?
            "$ALIAS_BINARY" $args > /tmp/oapx.out 2>/tmp/oapx.err && oapx_rc=0 || oapx_rc=$?
            if [ "$oxap_rc" != "$oapx_rc" ]; then
              echo "::error::'$args' exits $oxap_rc as oxap and $oapx_rc as oapx"
              exit 1
            fi
            if ! cmp -s /tmp/oxap.out /tmp/oapx.out; then
              echo "::error::'$args' stdout differs between oxap and oapx"
              exit 1
            fi
          done
          if ! grep -q "deprecated" /tmp/oapx.err; then
            echo "::error::oapx carried no deprecation note on stderr"
            exit 1
          fi
          if grep -q "deprecated" /tmp/oxap.err; then
            echo "::error::oxap carried the alias's deprecation note on stderr"
            exit 1
          fi

      - name: The Go SDK at this tag runs against the released binary
        if: steps.asset.outputs.withheld != 'true'
        shell: bash
        env:
          TESTS: ${{ matrix.sdk_tests }}
        run: |
          set -euo pipefail
          go test -count=1 -run "$TESTS" -v ./go/sdk/ > sdk.log 2>&1 || { cat sdk.log; exit 1; }
          cat sdk.log
          if grep -q -- '--- SKIP' sdk.log; then
            echo "::error::a smoke test skipped, so the released binary was not exercised"
            exit 1
          fi
          grep -c -- '--- PASS' sdk.log

  npm:
    name: Published npm package
    needs: resolve
    if: needs.resolve.outputs.tag != 'v0.1.0-alpha.31'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: The release is on npm
        id: published
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          ON_PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail
          missing=""
          for package in oap-sdk @oxap/cli @oxap/cli-linux-x64; do
            if ! npm view "$package@$VERSION" version >/dev/null 2>&1; then missing="$missing $package@$VERSION"; fi
          done
          if [ -z "$missing" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "published=false" >> "$GITHUB_OUTPUT"
          if [ "$ON_PULL_REQUEST" = "true" ]; then
            echo "::warning::not on npm:$missing; a release run fails here"
            exit 0
          fi
          echo "::error::not on npm:$missing, so nobody can install this release"
          exit 1

      - name: An installed package finds its runtime and lists providers
        if: steps.published.outputs.published == 'true'
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/app"
          mkdir -p "$app" "$RUNNER_TEMP/home"
          cd "$app"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "oap-sdk@$VERSION" "@oxap/cli@$VERSION"
          test "$(npx --no-install oxap --version)" = "oxap-$VERSION-linux-x64"
          HOME="$RUNNER_TEMP/home" node -e '
            const { createMakaiClient } = require("oap-sdk");
            (async () => {
              const client = await createMakaiClient();
              const providers = await client.auth.listProviders();
              await client.close();
              if (!Array.isArray(providers) || providers.length === 0) throw new Error("no providers listed");
              console.log(`listed ${providers.length} providers`);
            })().catch((error) => { console.error(error); process.exit(1); });
          '
