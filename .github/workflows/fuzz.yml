name: Fuzz

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  decoders:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - package: ./go/validation
            target: FuzzTheValidatorReachesAVerdictForAnyBytesAtAll
          - package: ./go/validation
            target: FuzzTheValidatorIsTotalOverARepeatedEnvelopeWithoutGrowingItsVerdictWithoutEnd
          - package: ./go/validation
            target: FuzzValidateNeverPanics
          - package: ./go/validation
            target: FuzzApplyEnvelopeNeverPanics
          - package: ./go/adapter/acp/internal/rpc
            target: FuzzTheJSONWalkAdmitsOnlyBytesJSONAdmits
          - package: ./go/adapter/acp/internal/rpc
            target: FuzzTheJSONWalkRefusesWellFormedJSONOnlyForADuplicateKey
          - package: ./go/adapter/claude/internal/rpc
            target: FuzzTheJSONWalkAdmitsOnlyBytesJSONAdmits
          - package: ./go/adapter/claude/internal/rpc
            target: FuzzTheJSONWalkRefusesWellFormedJSONOnlyForADuplicateKey
          - package: ./go/adapter/claude/internal/native
            target: FuzzAnObservationIsRefusedForAFrameTypeItDoesNotServeWhateverTheRawSays
          - package: ./go/adapter/claude/internal/native
            target: FuzzAControlRequestIsRefusedForASubtypeItDoesNotServeWhateverTheRawSays
          - package: ./go/adapter/claude/internal/native
            target: FuzzAnObservationOfARecordedFrameDecodesWithoutPanicking
          - package: ./go/adapter/codex/appserver/internal/rpc
            target: FuzzTheJSONWalkAdmitsOnlyBytesJSONAdmits
          - package: ./go/adapter/codex/appserver/internal/rpc
            target: FuzzTheJSONWalkRefusesWellFormedJSONOnlyForADuplicateKey
          - package: ./go/adapter/codex/appserver/internal/rpc
            target: FuzzAFrameIsEitherWithinTheLimitOrRefusedAndNeverAHalfMessage
          - package: ./go/adapter/codex/appserver/internal/rpc
            target: FuzzTheWalkRefusesADuplicateKeyInAnyFrameOfAMessage
          - package: ./go/adapter/deepseek/internal/native
            target: FuzzTheJSONWalkAdmitsOnlyValidJSON
          - package: ./go/adapter/deepseek/internal/native
            target: FuzzTheJSONWalkRefusesOnlyDuplicatesAndMalformedJSON
          - package: ./go/adapter/deepseek/internal/native
            target: FuzzANotificationIsRefusedForAMethodItDoesNotServeWhateverTheDataSays
          - package: ./go/adapter/deepseek/internal/native
            target: FuzzAStrictDecodeAdmitsOnlyOneWholeJSONDocument
          - package: ./go/adapter/hermes/internal/rpc
            target: FuzzTheJSONWalkAdmitsOnlyBytesJSONAdmits
          - package: ./go/adapter/hermes/internal/rpc
            target: FuzzTheJSONWalkRefusesWellFormedJSONOnlyForADuplicateKey
          - package: ./go/adapter/hermes/internal/native
            target: FuzzANotificationIsRefusedForAMethodItDoesNotServeWhateverTheDataSays
          - package: ./go/adapter/hermes/internal/native
            target: FuzzAServerRequestIsEitherAValueOrAnErrorAndNeverBothAtOnce
          - package: ./go/adapter/hermes/internal/native
            target: FuzzAStrictDecodeAdmitsOnlyOneWholeJSONDocument
          - package: ./go/adapter/opencode/internal/native
            target: FuzzAnEventIsAdmittedOnlyWithAValidIDTypeAndDurablePosition
          - package: ./go/adapter/opencode/internal/native
            target: FuzzAnAdmittedEventsDataIsAWholeJSONValueOrNothing
          - package: ./go/adapter/pi/internal/native
            target: FuzzTheJSONWalkAdmitsOnlyBytesJSONAdmits
          - package: ./go/adapter/pi/internal/native
            target: FuzzTheJSONWalkRefusesWellFormedJSONOnlyForADuplicateKey
          - package: ./go/adapter/pi/internal/native
            target: FuzzAStrictDecodeAdmitsOnlyOneWholeJSONDocument
    name: ${{ matrix.package }} ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - name: Fuzz
        run: go test ${{ matrix.package }} -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime 45s
      - name: Keep the input that failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-${{ matrix.package }}-${{ matrix.target }}
          path: ${{ matrix.package }}/testdata/fuzz/
          if-no-files-found: ignore
