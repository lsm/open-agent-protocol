name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Check comment policy
        run: go run ./go/tools/nocomment --check
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Race test
        run: go test -race ./...
      - name: Check executable core
        run: go run ./go/cmd/goap check

  go-sdk-smoke:
    name: Go SDK against a real runtime
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - name: Build the oapx binary
        run: zig build --build-file zig/build.zig install --prefix /tmp/oapx-go-sdk
      - name: Run the SDK tests
        env:
          OAP_SDK_BINARY_PATH: /tmp/oapx-go-sdk/bin/oapx
        run: go test -race ./go/sdk/...
      - name: Tests leave no credential store in the checkout
        if: always()
        run: ./scripts/check-no-test-litter.sh

  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - name: Incompatible changes to a public package must be recorded
        run: go run ./go/cmd/apidiffcheck

  ts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: clients/ts/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - run: npm ci
      - run: npm test
