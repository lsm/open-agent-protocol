name: CI

on:
  # Pushes run only on main, as ci-zig.yml already does. An unfiltered push gave
  # every in-repo pull request branch a second, push-event run of this workflow on
  # the same sha as its pull_request run: the same `test`, the same `go-sdk-smoke`,
  # the same `ts` and `compatibility`, all of them duplicated. A branch push with
  # no pull request open got the run with nothing waiting on it, which is the
  # common case while a lane is mid-stack.
  #
  # The pull_request trigger below still covers every branch with an open pull
  # request, which is the check the merge gate reads, so narrowing this loses no
  # gate coverage. A push to a branch whose pull request is not open yet is
  # checked when the pull request opens.
  push:
    branches: [main]
  pull_request:
    # `edited` is load-bearing for the compatibility gate, which records an
    # incompatible Go change in the pull request description: a body edit is the
    # only way that record changes after the last run, and without it a deleted
    # or mis-cased `## Breaking changes` section would leave the break recorded
    # nowhere -- the push run skips that job, and the release lifts nothing.
    #
    # It also fires on a title edit, so an edit costs one run of this workflow
    # rather than one job. The other jobs are deliberately NOT skipped on an
    # edited run: a skipped check reports as `skipped` rather than passing, and
    # the merge gate reads the current head's checks, so scoping the re-run to
    # the gate alone would risk the very merge it is meant to keep safe.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  # One group per pull request, so a newer push to that pull request cancels the
  # run the previous push started, queued or in progress. A push carries no pull
  # request number, so it falls back to its own run id and shares a group with
  # nothing: every main commit keeps its own run, and cancel-in-progress is false
  # off a pull request besides. The event name is in the group so a push and a
  # pull request cannot land in one group -- a pull request number and a run id
  # come from separate counters, and the two must never be interchangeable. The
  # ci- and ci-zig- prefixes must stay distinct too: both files display as "CI",
  # so one shared prefix would have the two workflows cancel each other.
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Check comment policy
        run: go run ./go/tools/nocomment --check
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Race test
        run: go test -race ./...
      - name: Check executable core
        run: go run ./go/cmd/goap check

  go-sdk-smoke:
    name: Go SDK against a real runtime
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - name: Build the oapx binary
        run: zig build --build-file zig/build.zig install --prefix /tmp/oapx-go-sdk
      - name: Run the SDK tests
        env:
          OAP_SDK_BINARY_PATH: /tmp/oapx-go-sdk/bin/oapx
        run: go test -race ./go/sdk/...
      - name: Tests leave no credential store in the checkout
        if: always()
        run: ./scripts/check-no-test-litter.sh

  compatibility:
    # pull_request only: the record an incompatible change has to appear in is
    # the pull request description, and a push to main carries no description.
    # On a push the change has already been reviewed and recorded, so there is
    # nothing for this job to check that the pull request run did not.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      # The comparison is against this pull request's own base, not the last
      # release tag. A tag comparison is cumulative, so every pull request would
      # have to re-record every break any earlier one made, which is why the
      # description as the record could not work while both were in place. The
      # cumulative view still exists: the release lifts each pull request's
      # Breaking changes section into the notes, so the release section names
      # every break since the last tag.
      - name: Check out the base commit to compare against
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/base"
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA"

      - name: Write the pull request description where the checker reads it
        env:
          # The description is the record now that a PR does not edit
          # CHANGELOG.md, so the gate reads the body's Breaking changes section
          # instead of that file's Unreleased section.
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"

      - name: An incompatible public API change must be recorded in this pull request
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BASE_ROOT: ${{ runner.temp }}/base
        run: go run ./go/cmd/apidiffcheck -description "$RUNNER_TEMP/pr-body.md"

  ts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: clients/ts/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - run: npm ci
      - run: npm test
