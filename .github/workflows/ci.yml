name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Check comment policy
        run: go run ./tools/nocomment --check
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Race test
        run: go test -race ./...
      - name: Check executable core
        run: go run ./cmd/oap check

  ts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: clients/ts/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - run: npm ci
      - run: npm test
