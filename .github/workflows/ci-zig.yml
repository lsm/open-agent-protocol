name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # The same superseding rule as ci.yml, under a prefix that keeps the two
  # workflows apart: both display as "CI", so a shared group would cancel this
  # file's run whenever the other's was queued on the same pull request. A push
  # carries no pull request number, so it falls back to its own run id and
  # shares a group with nothing, which is what keeps a run per main commit.
  group: ci-zig-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-secrets:
    name: Check Available Secrets
    runs-on: ubuntu-latest
    outputs:
      has_anthropic: ${{ steps.check.outputs.has_anthropic }}
      has_openai: ${{ steps.check.outputs.has_openai }}
      has_google: ${{ steps.check.outputs.has_google }}
      has_azure: ${{ steps.check.outputs.has_azure }}
      has_ollama: ${{ steps.check.outputs.has_ollama }}
      has_github_copilot: ${{ steps.check.outputs.has_github_copilot }}
    steps:
      - name: Check which secrets are available
        id: check
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          GH_COPILOT_REFRESH: ${{ secrets.GH_COPILOT_REFRESH }}
          GH_COPILOT_ACCESS: ${{ secrets.GH_COPILOT_ACCESS }}
        run: |
          has_anthropic=false
          has_openai=false
          has_google=false
          has_azure=false
          has_ollama=false
          has_github_copilot=false
          if [ -n "$ANTHROPIC_API_KEY" ] || [ -n "$ANTHROPIC_AUTH_TOKEN" ]; then has_anthropic=true; fi
          if [ -n "$OPENAI_API_KEY" ]; then has_openai=true; fi
          if [ -n "$GOOGLE_API_KEY" ]; then has_google=true; fi
          if [ -n "$AZURE_OPENAI_API_KEY" ] && [ -n "$AZURE_OPENAI_ENDPOINT" ]; then has_azure=true; fi
          if [ -n "$OLLAMA_API_KEY" ]; then has_ollama=true; fi
          if [ -n "$GH_COPILOT_REFRESH" ] && [ -n "$GH_COPILOT_ACCESS" ]; then has_github_copilot=true; fi
          {
            echo "has_anthropic=$has_anthropic"
            echo "has_openai=$has_openai"
            echo "has_google=$has_google"
            echo "has_azure=$has_azure"
            echo "has_ollama=$has_ollama"
            echo "has_github_copilot=$has_github_copilot"
          } >> "$GITHUB_OUTPUT"

  # =============================================================================
  # Unit Tests (always run, no secrets needed)
  # =============================================================================
  unit-tests:
    name: Unit Tests - ${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        group: [core, transport, protocol, providers, utils, makai-cli, tui, tools, agent-types, agent-loop, agent-mod, agent-bridge, agent-unit, agent-chain, validation, adapter, stdio-host, hub]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Zig pattern guardrails
        run: ./scripts/check-zig-patterns.sh

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Cache Zig
        uses: actions/cache@v4
        with:
          path: ~/.cache/zig
          key: ${{ runner.os }}-zig-${{ hashFiles('zig/build.zig.zon') }}
          restore-keys: |
            ${{ runner.os }}-zig-

      - name: Run ${{ matrix.group }} unit tests
        run: zig build --build-file zig/build.zig test-unit-${{ matrix.group }}

      - name: Tests leave no credential store in the checkout
        if: always()
        run: ./scripts/check-no-test-litter.sh

  no-comments:
    name: Zero-Comments Policy
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # Full history so the ratchet can resolve the submitted range's start
      # (the pull request's base sha, or a push's pre-update sha) — a
      # shallow clone would leave that commit unfetched, and an explicitly
      # requested base that cannot resolve is a hard error in the checker.
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install npm dependencies
        run: npm ci

      - name: Run checker self-tests
        run: node --test scripts/check-no-comments.test.mjs

      - name: Run changelog-release self-tests
        run: node --test scripts/changelog-release.test.mjs

      - name: Check zero-comments policy
        run: node scripts/check-no-comments.mjs --check --base "$BASE_SHA"
        env:
          # The PR base sha or the push's pre-update sha: the start of the
          # submitted range, so an allowlist addition anywhere in it is
          # caught. Empty falls through to the checker's HEAD^1 comparison.
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

      - name: Check zero-comments policy on the cleaned oap-client files
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_ROOT: ${{ github.workspace }}
        run: |
          set -euo pipefail
          # The checker runs from the base tip, not from this pull request's head:
          # the tool that judges a change must not be part of the change, and that
          # has to hold for its dependencies too. Judged contents are the head
          # checkout's, because the command runs in HEAD_ROOT and --files resolves
          # against the working directory.
          #
          # The worktree installs its own node_modules from the base tip's lockfile
          # rather than symlinking the head's. A symlink would leave the judging
          # lexer resolved from the head: a pull request bumping typescript would
          # change what counts as a comment, which is the same defect one level
          # down. npm ci is deterministic because the base tip's package-lock.json
          # pins the version.
          git worktree add --detach "$RUNNER_TEMP/cleaned" "origin/$BASE_REF"
          (cd "$RUNNER_TEMP/cleaned" && npm ci --no-audit --no-fund)
          files=(
          clients/ts/test/client.test.ts
          clients/ts/test/events.test.ts
          clients/ts/test/integration.test.ts
          clients/ts/test/schema.test.ts
          clients/ts/test/sse.test.ts
          clients/ts/test/transport.ts
          clients/ts/src/protocol.ts
          clients/ts/src/events.ts
          clients/ts/src/session.ts
          clients/ts/src/client.ts
          clients/ts/src/errors.ts
          clients/ts/src/sse.ts
          clients/ts/src/index.ts
          )
          # An empty selection exits 0 having judged nothing, and a missing path is
          # skipped silently, so both are refused here rather than reported green.
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no paths selected: refusing a vacuous check" >&2
            exit 1
          fi
          for f in "${files[@]}"; do
            if [ ! -f "$HEAD_ROOT/$f" ]; then
              echo "selected path absent from the head checkout: $f" >&2
              exit 1
            fi
          done
          cd "$HEAD_ROOT"
          node "$RUNNER_TEMP/cleaned/scripts/check-no-comments.mjs" \
            --check --base "$BASE_SHA" --files "${files[@]}"

  ts-sdk-e2e:
    name: TS SDK E2E
    needs: [unit-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install npm dependencies
        run: npm ci

      - name: Build the oapx binary for TS SDK E2E
        run: zig build --build-file zig/build.zig install --prefix /tmp/makai-smoke

      - name: Run TS SDK unit + E2E tests
        env:
          OAP_SDK_BINARY_PATH: /tmp/makai-smoke/bin/oapx
        run: npm run test:sdk

      - name: Type-check the TypeScript README samples
        run: npm run check:readme

      - name: Verify npm package ships TypeScript declarations
        run: npm run check:declarations

      - name: Tests leave no credential store in the checkout
        if: always()
        run: ./scripts/check-no-test-litter.sh


  backend-parity:
    name: Parity - oapx served backends against goap
    needs: [unit-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Build oapx
        run: zig build --build-file zig/build.zig install --prefix /tmp/oapx-parity

      - name: Require each backend to answer and write its child exactly as goap does
        env:
          OAP_OAPX_BIN: /tmp/oapx-parity/bin/oapx
        run: go test ./go/cmd/goap/ -run TestBackendsMatchOapx -v

  pi-parity-repeat:
    name: Parity - the pi scenario twenty times over
    needs: [unit-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Build oapx
        run: zig build --build-file zig/build.zig install --prefix /tmp/oapx-repeat

      - name: The pi scenario must not depend on goroutine scheduling
        env:
          OAP_OAPX_BIN: /tmp/oapx-repeat/bin/oapx
        run: go test ./go/cmd/goap/ -run 'TestBackendsMatchOapx/pi$' -count=20

  memory-conformance:
    name: Conformance and parity - oapx memory backend
    needs: [unit-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Build oapx
        run: zig build --build-file zig/build.zig install --prefix /tmp/oapx-memory

      - name: Run goap conformance against oapx serve agent --backend memory
        run: go run ./go/cmd/goap conformance --command "/tmp/oapx-memory/bin/oapx serve agent --backend memory"

      - name: Require oapx's memory backend to answer exactly as goap's
        env:
          OAP_OAPX_BIN: /tmp/oapx-memory/bin/oapx
        run: go test ./go/cmd/goap/ -run TestMemoryBackendMatchesOapx -v

  hub-parity:
    name: Differential - the two stdio hubs answer the same
    needs: [unit-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Build oapx
        run: zig build --build-file zig/build.zig install --prefix /tmp/oapx-hub

      - name: Require oapx serve --stdio to answer exactly as goap serve --stdio
        env:
          OAP_OAPX_BIN: /tmp/oapx-hub/bin/oapx
        run: go test ./go/cmd/goap/ -run 'TestHub(Stdio|Refuses|Addr)' -v

      - name: Require oapx serve to refuse what it does not carry
        run: |
          set -euo pipefail
          if /tmp/oapx-hub/bin/oapx serve --config=missing.json </dev/null >/dev/null 2>&1; then
            echo "oapx serve --config=missing.json exited 0; a config it cannot read must not"
            exit 1
          fi

      - name: Require oapx serve --addr to bind a loopback address and end on an interrupt
        run: |
          set -euo pipefail
          bound=/tmp/oapx-hub-addr.out
          /tmp/oapx-hub/bin/oapx serve --addr=127.0.0.1:0 </dev/null >"$bound" 2>&1 &
          hub=$!
          for _ in $(seq 1 40); do
            grep -q '^listening on http://' "$bound" && break
            kill -0 "$hub" 2>/dev/null || break
            sleep 0.5
          done
          if ! grep -q '^listening on http://' "$bound"; then
            echo "oapx serve --addr never reported a bound address:"
            cat "$bound"
            kill -9 "$hub" 2>/dev/null || true
            exit 1
          fi
          kill -INT "$hub"
          for _ in $(seq 1 40); do
            kill -0 "$hub" 2>/dev/null || break
            sleep 0.5
          done
          if kill -0 "$hub" 2>/dev/null; then
            echo "oapx serve --addr ignored an interrupt:"
            cat "$bound"
            kill -9 "$hub" 2>/dev/null || true
            exit 1
          fi
          wait "$hub" || { echo "oapx serve --addr did not end cleanly on an interrupt"; cat "$bound"; exit 1; }

  # =============================================================================
  hub-clients-ts:
    name: Differential - the TypeScript client against oapx serve
    needs: [unit-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: clients/ts
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: clients/ts/package-lock.json

      - name: Build oapx
        working-directory: .
        run: zig build --build-file zig/build.zig install --prefix /tmp/oapx-hub

      - run: npm ci

      - name: Run the clients/ts suite, the one ci.yml runs against goap serve, against oapx serve
        env:
          OAP_TS_HUB: /tmp/oapx-hub/bin/oapx
        run: npm test

  rust-sdk:
    name: Rust SDK
    needs: [unit-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sdk/rust
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            sdk/rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('sdk/rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build the oapx binary for Rust SDK E2E
        working-directory: .
        run: zig build --build-file zig/build.zig install --prefix /tmp/makai-rs

      - name: Run Rust SDK unit + E2E tests
        env:
          OAP_SDK_BINARY_PATH: /tmp/makai-rs/bin/oapx
        run: cargo test --all-features

      - name: Tests leave no credential store in the checkout
        if: always()
        working-directory: .
        run: ./scripts/check-no-test-litter.sh

  # =============================================================================
  # Python SDK (sdk/python/)
  #
  # Mirrors ts-sdk-e2e: build the runtime, point OAP_SDK_BINARY_PATH at it, and
  # run the suite. Without that variable every test in
  # sdk/python/tests/test_real_binary.py skips, so the E2E lane sets it explicitly.
  #
  # OAP_SDK_TEST_REAL_AUTH is deliberately NOT set: the auth-protocol E2E test
  # stays opt-in. On macOS an unsigned local build blocks on a Keychain access
  # prompt and auth_providers_request never answers. Linux reads
  # ~/.oapx/auth.json instead and should be fine, but that has not been
  # verified on a runner, so enabling it here is left as a follow-up rather
  # than a guess that could redden main.
  #
  # The Python SDK is not wired into the Zig build; zig build install is used
  # only to produce the binary this job exercises.
  # =============================================================================
  python-sdk-e2e:
    name: Python SDK E2E
    needs: [unit-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python SDK with dev extras
        working-directory: sdk/python
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Type check (mypy --strict)
        working-directory: sdk/python
        run: python -m mypy

      - name: Type check the README samples
        run: python scripts/check_readme_samples.py

      - name: Build the oapx binary for Python SDK E2E
        run: zig build --build-file zig/build.zig install --prefix /tmp/makai-py

      - name: Run Python SDK unit + E2E tests
        working-directory: sdk/python
        env:
          OAP_SDK_BINARY_PATH: /tmp/makai-py/bin/oapx
        run: python -m pytest -q

      - name: Tests leave no credential store in the checkout
        if: always()
        run: ./scripts/check-no-test-litter.sh

  # =============================================================================
  # TUI PTY Harness (deterministic, fixture provider — no API keys)
  #
  # Drives `oapx --tui` through a pseudo-terminal with the canned-reply
  # fixture (OAPX_TUI_FIXTURE), asserting the core loop scenario plus the
  # #264 UX-sweep scenarios (every ratified slash command, kept key, the
  # y/a/n approval flow, session save+resume) and recording the TUI
  # performance baseline (startup-to-first-frame, keypress-to-render latency,
  # binary size, tui/ LOC). Metrics and the scenario summary land in the job
  # summary and the run artifacts; see scripts/tui-pty-driver.py and
  # docs/tui-performance-baseline.md. The provider-* scenarios run without the
  # fixture against scripts/tui-fake-provider.py, a local static SSE server,
  # so the real provider path (bridge, registry, HTTP client, SSE parsing) is
  # exercised too; provider-https trusts a throwaway CA installed into the
  # runner's system bundle, which is where Zig's std reads roots on Linux.
  # =============================================================================
  tui-pty-harness:
    name: TUI PTY Harness
    needs: [unit-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Cache Zig
        uses: actions/cache@v4
        with:
          path: ~/.cache/zig
          key: ${{ runner.os }}-zig-${{ hashFiles('zig/build.zig.zon') }}
          restore-keys: |
            ${{ runner.os }}-zig-

      - name: Run TUI PTY driver
        run: |
          zig build --build-file zig/build.zig install -Doptimize=ReleaseFast --prefix "$RUNNER_TEMP/makai-pty"
          python3 scripts/tui-fake-provider.py gen-certs "$RUNNER_TEMP/pty-tls"
          sudo cp "$RUNNER_TEMP/pty-tls/ca.pem" /usr/local/share/ca-certificates/oap-tui-pty-test.crt
          sudo update-ca-certificates
          python3 scripts/tui-pty-driver.py --binary "$RUNNER_TEMP/makai-pty/bin/oapx" --output-dir tui-pty-out --scenario all --tls-dir "$RUNNER_TEMP/pty-tls"

      - name: Tests leave no credential store in the checkout
        if: always()
        run: ./scripts/check-no-test-litter.sh

      - name: Record metrics in job summary
        if: success()
        run: |
          {
            echo '### TUI PTY baseline'
            echo '```json'
            cat tui-pty-out/metrics.json
            echo '```'
            echo '### TUI PTY scenario summary'
            echo '```json'
            cat tui-pty-out/summary.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload TUI PTY artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tui-pty-harness
          path: tui-pty-out/
          if-no-files-found: warn

  # =============================================================================
  # Cross-compile Smoke (release-target coverage)
  #
  # Unit CI only compiles for the host (linux), so macOS/Windows release
  # targets were never compiled before the first release tag, breaking the
  # release run (#196). This job compiles every release target not already
  # covered by native jobs on every PR (compile + link only; nothing is
  # executed).
  #
  # Scoping: building for macOS requires the macOS SDK (frameworks + sysroot),
  # which hosted Linux runners do not have, so the macOS targets run on
  # macos-latest (aarch64 natively, x86_64 cross-compiled from the same SDK).
  # x86_64-windows cross-compiles from Linux using Zig's bundled mingw-w64, as
  # does aarch64-linux. The x86_64-linux release target is already compiled
  # natively by the unit-test jobs and is not repeated here.
  # =============================================================================

  windows-unit:
    name: Unit Tests - stdio-host (windows)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Run stdio-host unit tests
        shell: bash
        run: zig build --build-file zig/build.zig test-unit-stdio-host --summary all

  cross-compile-smoke:
    name: Cross-compile - ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-macos
            binary_name: oapx
          - runner: macos-latest
            target: x86_64-macos
            binary_name: oapx
          - runner: ubuntu-latest
            target: aarch64-linux
            binary_name: oapx
          - runner: ubuntu-latest
            target: x86_64-windows
            binary_name: oapx.exe
          - runner: windows-latest
            target: aarch64-windows
            binary_name: oapx.exe
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # Zig cannot locate the macOS SDK by itself when an explicit -Dtarget is
      # passed (#196): framework resolution fails with "unable to find
      # framework 'Security'. searched paths: none". Export SDKROOT for the
      # build.zig SDK lookup and fail fast if the SDK is unusable.
      - name: Resolve macOS SDK (SDKROOT)
        if: contains(matrix.target, 'macos')
        shell: bash
        run: |
          set -euo pipefail
          SDK_PATH="$(xcrun --show-sdk-path)"
          echo "SDKROOT=${SDK_PATH}" >> "$GITHUB_ENV"
          test -d "${SDK_PATH}/System/Library/Frameworks/Security.framework"

      - name: Compile ${{ matrix.target }} binary
        shell: bash
        run: |
          set -euo pipefail
          zig build --build-file zig/build.zig install -Dtarget=${{ matrix.target }} --prefix "$RUNNER_TEMP/makai-smoke-${{ matrix.target }}"

      - name: Verify binary was produced
        shell: bash
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/makai-smoke-${{ matrix.target }}/bin/${{ matrix.binary_name }}"

      # The multi-session hub is not in the oapx binary yet, so the cross-compile
      # above never reaches it: #454 would not have built on Windows and both jobs
      # were green. Compiled here, never run — a foreign target's test binary
      # cannot execute on this runner, and the point is that it compiles.
      - name: Compile the multi-session hub
        if: contains(matrix.target, 'windows')
        shell: bash
        run: zig build --build-file zig/build.zig compile-hub -Dtarget=${{ matrix.target }}

  # =============================================================================
  # E2E Tests (run in parallel)
  # Add new tests by adding a new job following the pattern below
  # =============================================================================

  e2e-anthropic:
    name: E2E - Anthropic
    needs: [unit-tests, check-secrets]
    if: needs.check-secrets.outputs.has_anthropic == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions/cache@v4
        with:
          path: ~/.cache/zig
          key: ${{ runner.os }}-zig-${{ hashFiles('zig/build.zig.zon') }}
          restore-keys: |
            ${{ runner.os }}-zig-
      - name: Run Anthropic E2E tests
        run: zig build --build-file zig/build.zig test-e2e-anthropic
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_MODEL: claude-haiku-4-5

  e2e-openai:
    name: E2E - OpenAI
    needs: [unit-tests, check-secrets]
    if: needs.check-secrets.outputs.has_openai == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
