name: Release Binaries

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  versions:
    name: Every package carries the release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - id: version
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="$(node scripts/release-channels.mjs versions --tag "$GITHUB_REF_NAME")"
          else
            version="$(node scripts/release-channels.mjs versions)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build-binaries:
    name: Build ${{ matrix.os_name }}-${{ matrix.arch_name }}
    needs: [versions]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-macos
            os_name: macos
            arch_name: arm64
            archive: tar.gz
            binary_name: oxap
            alias_name: oapx
            npm_target: darwin-arm64
          - runner: macos-latest
            target: x86_64-macos
            os_name: macos
            arch_name: x64
            archive: tar.gz
            binary_name: oxap
            alias_name: oapx
            npm_target: darwin-x64
          - runner: ubuntu-latest
            target: aarch64-linux
            os_name: linux
            arch_name: arm64
            archive: tar.gz
            binary_name: oxap
            alias_name: oapx
            npm_target: linux-arm64
          - runner: ubuntu-latest
            target: x86_64-linux
            os_name: linux
            arch_name: x64
            archive: tar.gz
            binary_name: oxap
            alias_name: oapx
            npm_target: linux-x64
          - runner: windows-latest
            target: x86_64-windows
            os_name: windows
            arch_name: x64
            archive: zip
            binary_name: oxap.exe
            alias_name: oapx.exe
            npm_target: win32-x64
          - runner: windows-latest
            target: aarch64-windows
            os_name: windows
            arch_name: arm64
            archive: zip
            binary_name: oxap.exe
            alias_name: oapx.exe
            npm_target: win32-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      # Zig cannot locate the macOS SDK by itself when an explicit -Dtarget is
      # passed (#196): framework resolution fails with "unable to find
      # framework 'Security'. searched paths: none". Export SDKROOT for the
      # build.zig SDK lookup and fail fast if the SDK is unusable.
      - name: Resolve macOS SDK (SDKROOT)
        if: matrix.os_name == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          SDK_PATH="$(xcrun --show-sdk-path)"
          echo "SDKROOT=${SDK_PATH}" >> "$GITHUB_ENV"
          test -d "${SDK_PATH}/System/Library/Frameworks/Security.framework"

      - name: Build target binary
        shell: bash
        run: |
          set -euo pipefail
          OUT_ROOT="$GITHUB_WORKSPACE/dist-root/${{ matrix.os_name }}-${{ matrix.arch_name }}"
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            VERSION="$(node -p "require('./package.json').version")"
          fi
          zig build --build-file zig/build.zig install -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe -Dversion="$VERSION" --prefix "$OUT_ROOT"

      # Secret names and formats match lsm/hyperneo so one set of values serves both
      # repos: APPLE_CERTIFICATE is the base64 .p12, APPLE_API_PRIVATE_KEY is the raw
      # .p8 PEM text (not base64), and APPLE_API_KEY is the key id the .p8 filename
      # must carry. APPLE_SIGNING_IDENTITY takes either the certificate's SHA-1 hash
      # or its "Developer ID Application: ..." name; the throwaway keychain below
      # holds exactly one certificate, so the name cannot be ambiguous here the way
      # it can on a developer machine that imported the certificate twice.
      - name: Sign and notarize macOS binary
        if: matrix.os_name == 'macos'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          BINARY="$GITHUB_WORKSPACE/dist-root/${{ matrix.os_name }}-${{ matrix.arch_name }}/bin/${{ matrix.binary_name }}"

          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            if [ "${{ github.event_name }}" = "push" ]; then
              case "$GITHUB_REF_NAME" in
                *-*)
                  echo "MACOS_WITHHELD=true" >> "$GITHUB_ENV"
                  echo "::warning::APPLE_CERTIFICATE is unset on the prerelease tag $GITHUB_REF_NAME; withholding the ${{ matrix.arch_name }} macOS artifact rather than shipping it unsigned"
                  exit 0
                  ;;
              esac
              echo "::error::APPLE_CERTIFICATE is unset on a stable tag build; a release must ship signed macOS binaries"
              exit 1
            fi
            echo "::warning::macOS signing secrets are unset; leaving ${{ matrix.arch_name }} binary unsigned (workflow_dispatch only)"
            exit 0
          fi

          KEYCHAIN="$RUNNER_TEMP/codesign.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 900 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null

          codesign --force --timestamp --options runtime \
            --identifier ai.hyperneo.oap \
            --keychain "$KEYCHAIN" \
            --sign "$APPLE_SIGNING_IDENTITY" \
            "$BINARY"
          codesign --verify --strict --verbose=2 "$BINARY"
          cp "$BINARY" "$(dirname "$BINARY")/${{ matrix.alias_name }}"

          if [ -z "${APPLE_API_PRIVATE_KEY:-}" ]; then
            if [ "${{ github.event_name }}" = "push" ]; then
              case "$GITHUB_REF_NAME" in
                *-*)
                  echo "MACOS_WITHHELD=true" >> "$GITHUB_ENV"
                  echo "::warning::signing succeeded but APPLE_API_PRIVATE_KEY is unset on the prerelease tag $GITHUB_REF_NAME; withholding the ${{ matrix.arch_name }} macOS artifact rather than shipping it unnotarized"
                  exit 0
                  ;;
              esac
              echo "::error::signing succeeded but APPLE_API_PRIVATE_KEY is unset on a stable tag build; an unnotarized Developer ID binary is still blocked by Gatekeeper"
              exit 1
            fi
            echo "::warning::notarization secrets are unset; leaving the signed ${{ matrix.arch_name }} binary unnotarized (workflow_dispatch only)"
            exit 0
          fi

          KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          ditto -c -k --keepParent "$BINARY" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait --timeout 30m
          rm -f "$KEY_PATH" "$RUNNER_TEMP/notarize.zip"

          codesign --display --verbose=4 "$BINARY" 2>&1 | grep -E 'Identifier|Authority|TeamIdentifier|flags'

      - name: Discard signing keychain
        if: always() && matrix.os_name == 'macos'
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/codesign.keychain-db" 2>/dev/null || true

      - name: Package tar.gz
        if: matrix.archive == 'tar.gz' && env.MACOS_WITHHELD != 'true'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            VERSION="$(node -p "require('./package.json').version")"
          fi
          ARTIFACT="oxap-${VERSION}-${{ matrix.os_name }}-${{ matrix.arch_name }}.tar.gz"
          BIN_DIR="$GITHUB_WORKSPACE/dist-root/${{ matrix.os_name }}-${{ matrix.arch_name }}/bin"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          tar -C "$BIN_DIR" -czf "$GITHUB_WORKSPACE/dist/$ARTIFACT" "${{ matrix.binary_name }}" "${{ matrix.alias_name }}"

      - name: Package zip
        if: matrix.archive == 'zip' && env.MACOS_WITHHELD != 'true'
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $env:GITHUB_REF_NAME.Substring(1)
          } else {
            (Get-Content package.json | ConvertFrom-Json).version
          }
          $artifact = "oxap-$version-${{ matrix.os_name }}-${{ matrix.arch_name }}.zip"
          $binDir = "$env:GITHUB_WORKSPACE/dist-root/${{ matrix.os_name }}-${{ matrix.arch_name }}/bin"
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE/dist" | Out-Null
          Compress-Archive -Path "$binDir/${{ matrix.binary_name }}", "$binDir/${{ matrix.alias_name }}" -DestinationPath "$env:GITHUB_WORKSPACE/dist/$artifact" -Force

      - name: Upload packaged artifact
        if: env.MACOS_WITHHELD != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: oxap-${{ matrix.os_name }}-${{ matrix.arch_name }}
          path: dist/*
          if-no-files-found: error

      - name: Stage binary for npm packaging
        if: env.MACOS_WITHHELD != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist-npm-upload"
          cp "$GITHUB_WORKSPACE/dist-root/${{ matrix.os_name }}-${{ matrix.arch_name }}/bin/${{ matrix.binary_name }}" \
             "$GITHUB_WORKSPACE/dist-npm-upload/oxap-${{ matrix.npm_target }}"

      - name: Upload binary for npm packaging
        if: env.MACOS_WITHHELD != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: npm-binary-${{ matrix.npm_target }}
          path: dist-npm-upload/oxap-${{ matrix.npm_target }}
          if-no-files-found: error

  checksums:
    name: Generate checksums
    runs-on: ubuntu-latest
    needs: [build-binaries]
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create SHA256 checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum oxap-*.tar.gz oxap-*.zip > SHA256SUMS.txt

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: oxap-checksums
          path: dist/SHA256SUMS.txt

  # A pull request no longer edits CHANGELOG.md, so the notes for a release are
  # generated by scripts/changelog-release.mjs and committed before the tag. This
  # asserts that happened, on a tag only, and every job that publishes needs it.
  changelog:
    name: The tag ships its release notes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the tagged tree
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Require a section for this tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/changelog-release.mjs --verify-tag "$GITHUB_REF_NAME"

  package-npm:
    name: Package npm
    runs-on: ubuntu-latest
    needs: [versions, build-binaries, changelog]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript SDK
        run: npm run build:sdk

      - name: Verify npm package ships TypeScript declarations
        run: node scripts/check-npm-declarations.mjs

      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/bin
          pattern: npm-binary-*
          merge-multiple: true

      - name: Package npm packages
        env:
          VERSION: ${{ needs.versions.outputs.version }}
        run: |
          set -euo pipefail
          chmod +x dist/bin/* 2>/dev/null || true
          WITHHELD=""
          case "$VERSION" in
            *-*)
              for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64 win32-x64 win32-arm64; do
                if [ ! -f "dist/bin/oxap-$target" ]; then
                  WITHHELD="${WITHHELD:+$WITHHELD,}$target"
                fi
              done
              ;;
          esac
          if [ -n "$WITHHELD" ]; then
            echo "::warning::the build withheld $WITHHELD; their npm platform packages are skipped"
          fi
          npx tsx scripts/package-npm.ts --version "$VERSION" --withhold "$WITHHELD"

      - name: Pack every npm package, @oxap/client included
        run: |
          set -euo pipefail
          npm --prefix clients/ts ci
          mkdir -p dist/release/npm
          for pkg in dist/npm/cli-* dist/npm/cli dist/npm/oxap-sdk clients/ts; do
            npm pack "./$pkg" --pack-destination dist/release/npm
          done

      - uses: actions/upload-artifact@v4
        with:
          name: release-npm
          path: dist/release/npm/
          if-no-files-found: error

  package-crates:
    name: Package crates
    runs-on: ubuntu-latest
    needs: [versions]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable

      - name: Package the publishable crates in dependency order
        run: |
          set -euo pipefail
          args=()
          for crate in $(node scripts/release-channels.mjs crates); do args+=(-p "$crate"); done
          cargo package --locked --manifest-path rust/Cargo.toml "${args[@]}"
          mkdir -p dist/release/crates
          cp rust/target/package/*.crate dist/release/crates/

      - uses: actions/upload-artifact@v4
        with:
          name: release-crates
          path: dist/release/crates/
          if-no-files-found: error

  package-python:
    name: Package the Python wheel
    runs-on: ubuntu-latest
    needs: [versions]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build the wheel and sdist
        run: |
          set -euo pipefail
          python -m pip install --quiet build
          python -m build sdk/python --outdir dist/release/python

      - uses: actions/upload-artifact@v4
        with:
          name: release-python
          path: dist/release/python/
          if-no-files-found: error

  bundle:
    name: Bundle the release and the steps to publish it by hand
    runs-on: ubuntu-latest
    needs: [versions, checksums, package-npm, package-crates, package-python]
    env:
      VERSION: ${{ needs.versions.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/download-artifact@v4
        with:
          name: release-npm
          path: bundle/npm
      - uses: actions/download-artifact@v4
        with:
          name: release-crates
          path: bundle/crates
      - uses: actions/download-artifact@v4
        with:
          name: release-python
          path: bundle/python
      - uses: actions/download-artifact@v4
        with:
          pattern: oxap-*
          path: bundle/binaries
          merge-multiple: true

      - name: Write the digests and the hand-publishing steps
        run: |
          set -euo pipefail
          node scripts/release-channels.mjs commands --version "$VERSION" --run "$GITHUB_RUN_ID" --sha "$GITHUB_SHA" > "$RUNNER_TEMP/PUBLISH-BY-HAND.md"
          (cd bundle && find . -type f | sort | xargs sha256sum > "$RUNNER_TEMP/SHA256SUMS.txt")
          mv "$RUNNER_TEMP/SHA256SUMS.txt" "$RUNNER_TEMP/PUBLISH-BY-HAND.md" bundle/
          cat bundle/SHA256SUMS.txt
          cat bundle/PUBLISH-BY-HAND.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: bundle/
          if-no-files-found: error

  bundle-smoke:
    name: The packed release installs and runs
    runs-on: ubuntu-latest
    needs: [versions, bundle]
    env:
      VERSION: ${{ needs.versions.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: bundle
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install every package from the bundle and run it
        run: |
          set -euo pipefail
          bundle="$GITHUB_WORKSPACE/bundle"
          (cd "$bundle" && sha256sum --quiet -c SHA256SUMS.txt)
          mkdir -p "$RUNNER_TEMP/archive" "$RUNNER_TEMP/app"
          tar -xzf "$bundle/binaries/oxap-$VERSION-linux-x64.tar.gz" -C "$RUNNER_TEMP/archive"
          test "$("$RUNNER_TEMP/archive/oxap" --version)" = "$("$RUNNER_TEMP/archive/oapx" --version 2>/dev/null)"
          cd "$RUNNER_TEMP/app"
          npm init -y >/dev/null
          npm install --no-audit --no-fund \
            "$bundle/npm/oxap-cli-linux-x64-$VERSION.tgz" "$bundle/npm/oxap-cli-$VERSION.tgz" \
            "$bundle/npm/oxap-sdk-$VERSION.tgz" "$bundle/npm/oxap-client-$VERSION.tgz"
          test "$(npx --no-install oxap --version)" = "oxap-$VERSION-linux-x64"
          node --input-type=module -e 'await import("@oxap/sdk"); await import("@oxap/client"); console.log("imported @oxap/sdk and @oxap/client")'
          python -m venv venv
          venv/bin/pip install --quiet "$bundle"/python/*.whl
          venv/bin/python -c 'import oxap_sdk; print("imported", oxap_sdk.__name__)'
          ls "$bundle"/crates/*.crate

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [checksums, changelog, bundle-smoke]
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: oxap-*
          path: dist
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          overwrite_files: false
          files: |
            dist/oxap-*.tar.gz
            dist/oxap-*.zip
            dist/SHA256SUMS.txt

  # A first version is published by hand, because npm and crates.io only take a
  # trusted publisher for a package that exists. RELEASE_BOOTSTRAP=true makes
  # these jobs check that the hand-published versions are there instead of
  # publishing. Otherwise each publishes only what its registry lacks, so a
  # re-run of a failed tag fills in the missing channels and rewrites nothing.
  publish-npm:
    name: Publish npm packages
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [versions, changelog, bundle-smoke]
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.versions.outputs.version }}
      NPM_DIST_TAG: ${{ contains(github.ref_name, '-') && 'next' || 'latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: bundle
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: In bootstrap, check npm holds every package
        if: vars.RELEASE_BOOTSTRAP == 'true'
        run: node scripts/release-channels.mjs registry --version "$VERSION" --channel npm --bundle bundle --require-present

      - name: Publish what npm lacks, platform packages first
        if: vars.RELEASE_BOOTSTRAP != 'true'
        run: |
          set -euo pipefail
          node scripts/release-channels.mjs registry --version "$VERSION" --channel npm --bundle bundle | tee npm.txt
          for spec in $(awk '$1 == "missing" { print $3 }' npm.txt); do
            name="${spec%@*}"
            npm publish "bundle/npm/$(printf '%s' "${name#@}" | tr / -)-$VERSION.tgz" --access public --provenance --tag "$NPM_DIST_TAG"
          done

  publish-crates:
    name: Publish crates
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [versions, changelog, bundle-smoke]
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.versions.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable

      - name: In bootstrap, check crates.io holds every crate
        if: vars.RELEASE_BOOTSTRAP == 'true'
        run: node scripts/release-channels.mjs registry --version "$VERSION" --channel crates --require-present

      - uses: rust-lang/crates-io-auth-action@v1
        if: vars.RELEASE_BOOTSTRAP != 'true'
        id: auth

      - name: Publish what crates.io lacks, in dependency order
        if: vars.RELEASE_BOOTSTRAP != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          node scripts/release-channels.mjs registry --version "$VERSION" --channel crates | tee crates.txt
          for spec in $(awk '$1 == "missing" { print $3 }' crates.txt); do
            cargo publish --locked --manifest-path rust/Cargo.toml -p "${spec%@*}"
          done

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [versions, changelog, bundle-smoke]
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: bundle

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: bundle/python
          skip-existing: true

  smoke:
    name: Release smoke
    needs: [release, publish-npm, publish-crates, publish-pypi]
    if: ${{ always() && needs.release.result == 'success' }}
    uses: ./.github/workflows/release-smoke.yml
    with:
      tag: ${{ github.ref_name }}
